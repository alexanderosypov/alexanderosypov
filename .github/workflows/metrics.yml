name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # REQUIRED: You must use a Personal Access Token here
          token: ${{ secrets.METRIC_TOKEN }}

          # Options
          user: alexanderosypov
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Chicago
          config_order: base.header, base.activity, base.community, base.repositories, base.metadata

          # Plugins (Configured without the invalid global theme input)
          plugin_lines: yes
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 6
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
